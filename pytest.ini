# Pytest configuration.
#
# ``testpaths`` exists for one concrete reason: ``smoke_test.py`` at the
# project root is a hand-run launch check, not a pytest module, but its
# filename matches pytest's default ``*_test.py`` collection pattern. It
# sets ``QT_QPA_PLATFORM=offscreen`` at import time, which pins the
# screen to 800x800 before the ``qapp`` fixture is created and makes the
# companion-anchoring test in ``tests/test_bubble_from_sprite.py`` fail
# on geometry it never sees when run on its own.
#
# Naming the test directory explicitly fixes that without touching the
# smoke script, which stays runnable as ``python smoke_test.py``.
[pytest]
testpaths = tests
